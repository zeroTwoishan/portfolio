<!doctype html>
<!-- Social preview (1200×630). Rendered to public/og.jpg by scripts/og.mjs with headless Chrome,
     so it uses the site's real fonts and the edited portrait. -->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face { font-family: 'Instrument Serif'; src: url(../node_modules/@fontsource/instrument-serif/files/instrument-serif-latin-400-normal.woff2); }
      @font-face { font-family: 'Instrument Serif'; font-style: italic; src: url(../node_modules/@fontsource/instrument-serif/files/instrument-serif-latin-400-italic.woff2); }
      @font-face { font-family: 'Martian Mono'; src: url(../node_modules/@fontsource-variable/martian-mono/files/martian-mono-latin-wght-normal.woff2); }
      html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #090909 url(../public/grain.webp); color: #eae5dc; }
      body { position: relative; font-family: 'Instrument Serif', serif; }
      .glow { position: absolute; inset: 0; background: radial-gradient(40% 60% at 78% 50%, rgb(146 45 48 / 0.18), transparent); }
      .label { font-family: 'Martian Mono', monospace; font-size: 17px; letter-spacing: 0.04em; text-transform: uppercase; color: #a8a39c; }
      .copy { position: absolute; left: 72px; top: 72px; bottom: 72px; width: 640px; display: flex; flex-direction: column; justify-content: space-between; }
      h1 { margin: 0; font-weight: 400; font-size: 104px; line-height: 0.95; }
      .frame { position: absolute; right: 72px; top: 56px; width: 390px; height: 518px; border: 1px solid #292929; overflow: hidden; }
      .frame img { width: 100%; height: 100%; object-fit: cover; }
      .mark { display: inline-block; border: 1px solid #292929; padding: 4px 10px; color: #eae5dc; margin-right: 16px; }
      .rule { display: block; width: 120px; height: 2px; background: #c4474a; margin-top: 16px; }
    </style>
  </head>
  <body>
    <div class="glow"></div>
    <div class="copy">
      <div class="label"><span class="mark">IK</span>Ishan Keshari · Portfolio / 2026</div>
      <h1>I build things.<br /><em>And make them work.</em></h1>
      <div class="label">Full-stack developer · NIT Jalandhar<br />Beyond the frame.<span class="rule"></span></div>
    </div>
    <div class="frame"><img src="../public/media/portrait/ishan-edit-720.webp" alt="" /></div>
  </body>
</html>
