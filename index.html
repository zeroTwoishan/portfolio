    <!-- Motion hides content only under html.js, so no-JS visitors and crawlers see everything.
         Safety net: if the app hasn't started within 2.5 s, drop html.js so everything rests in its final state. -->
    <script>
      document.documentElement.classList.add('js')
      setTimeout(function () {
        var h = document.documentElement.classList
        if (!h.contains('motion-ready')) h.remove('js')
      }, 2500)
    </script>
  </head>

    <div id="root"><!--app--></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
